# Netlify Configuration

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Direcciones anteriores hacia el sitio nuevo
[[redirects]]
  from = "/inscripciones/*"
  to = "/#unite"
  status = 301

[[redirects]]
  from = "/inscripciones"
  to = "/#unite"
  status = 301

[[redirects]]
  from = "/la-jm.html"
  to = "/historia/"
  status = 301

[[redirects]]
  from = "/dar-el-paso.html"
  to = "/#unite"
  status = 301

[[redirects]]
  from = "/contacto.html"
  to = "/#unite"
  status = 301

[[redirects]]
  from = "/caminos.html"
  to = "/#etapas"
  status = 301

[[redirects]]
  from = "/cruzados.html"
  to = "/#etapas"
  status = 301

[[redirects]]
  from = "/pioneros.html"
  to = "/#etapas"
  status = 301

[[redirects]]
  from = "/universitarios.html"
  to = "/#etapas"
  status = 301

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
