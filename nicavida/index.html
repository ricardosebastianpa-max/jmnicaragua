<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#14213d" />
<title>NICAVIDA</title>
<style>
:root{--ink:#14213d;--paper:#f4ead7;--card:#fffaf0;--red:#d84a3b;--green:#2f8b66;--yellow:#f0b43c;--muted:#716d65;--line:rgba(20,33,61,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button{font:inherit}.app{min-height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 8%,rgba(240,180,60,.28),transparent 27%),radial-gradient(circle at 90% 20%,rgba(72,172,210,.20),transparent 27%),linear-gradient(#f8efdf,#f0dfc5)}
.start,.end{margin:auto 6px;background:rgba(255,250,240,.92);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 20px 60px rgba(54,43,28,.16)}.mark{width:58px;height:58px;border-radius:18px;background:var(--ink);color:white;display:grid;place-items:center;font-weight:1000;margin-bottom:18px;transform:rotate(-4deg)}h1{font-size:54px;letter-spacing:-3px;line-height:.86;margin:0;font-weight:1000}.start p{font-size:17px;line-height:1.45;color:#4d4942;margin:17px 0 22px}.btn{border:0;border-radius:17px;padding:15px 16px;font-weight:950;cursor:pointer}.primary{width:100%;background:var(--ink);color:#fff}.secondary{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:8px}
.top{display:flex;align-items:center;height:54px}.brand{font-size:18px;font-weight:1000}.step{margin-left:auto;font-size:11px;font-weight:900;color:var(--muted)}.progress{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.seg{height:5px;border-radius:20px;background:rgba(20,33,61,.12)}.seg.done{background:var(--ink)}.seg.now{background:var(--red)}
.meta{display:flex;justify-content:space-between;align-items:start;margin-top:12px}.stage{font-size:10px;font-weight:1000;letter-spacing:1.4px;color:var(--red);text-transform:uppercase}.age{font-size:34px;line-height:1;font-weight:1000;letter-spacing:-2px}.year{font-size:11px;color:var(--muted);font-weight:800;margin-top:3px}.rating{text-align:right}.rating small{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.rating b{font-size:25px}
.avatarZone{position:relative;height:31dvh;min-height:240px;max-height:330px;display:flex;justify-content:center;align-items:flex-end}.sun{position:absolute;width:145px;height:145px;border-radius:50%;background:rgba(240,180,60,.38);top:27px}.ground{position:absolute;left:-14px;right:-14px;bottom:0;height:62px;background:rgba(47,139,102,.13);border-radius:50% 50% 0 0}.avatar{position:relative;width:185px;height:230px;filter:drop-shadow(0 12px 10px rgba(55,43,27,.14));animation:pop .28s ease}.avatar svg{width:100%;height:100%}@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.card{margin-top:auto;background:rgba(255,250,240,.98);border:1px solid var(--line);border-radius:27px;padding:17px;box-shadow:0 -7px 28px rgba(54,43,28,.09),0 20px 60px rgba(54,43,28,.12)}.drawlab{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:1000}.draw{font-size:21px;line-height:1.05;font-weight:1000;letter-spacing:-.6px;margin:3px 0 10px}.card h2{font-size:23px;line-height:1.05;letter-spacing:-.8px;margin:0 0 8px}.body{font-size:14px;line-height:1.43;color:#3f3b35;margin:0 0 13px}.choices{display:grid;gap:8px}.choice{width:100%;border:1px solid rgba(20,33,61,.18);background:#fffefa;color:var(--ink);border-radius:15px;padding:12px 13px;min-height:52px;text-align:left;font-size:14px;font-weight:930;display:flex;align-items:center;gap:10px}.num{width:23px;height:23px;border-radius:8px;background:rgba(20,33,61,.08);display:grid;place-items:center;font-size:10px}.chance{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.sub{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.overlay{position:fixed;inset:0;background:rgba(20,33,61,.20);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:20}.result{width:min(520px,100%);margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(20,33,61,.16)}.status{font-size:10px;font-weight:1000;letter-spacing:1.3px;text-transform:uppercase}.good{color:var(--green)}.bad{color:var(--red)}.result h3{font-size:27px;letter-spacing:-1px;line-height:1;margin:6px 0 8px}.result p{font-size:15px;line-height:1.45;color:#3e3a34}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0}.chip{font-size:10px;font-weight:950;padding:6px 8px;border-radius:999px;background:rgba(20,33,61,.07)}
.end h2{font-size:42px;line-height:.92;letter-spacing:-2px;margin:8px 0 12px}.death{font-size:17px;line-height:1.45;color:#403b34}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.stat{background:rgba(20,33,61,.055);border-radius:15px;padding:11px}.stat small{display:block;font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase}.stat b{font-size:22px}.timeline{border-top:1px solid var(--line);margin:15px 0}.tl{display:grid;grid-template-columns:43px 1fr;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.35}.tl b{color:var(--red)}.fatal{margin:auto 10px;background:white;border-radius:22px;padding:22px}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
const A=document.getElementById('app');
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const origins=[
{where:'Managua',tier:1,text:'Vivís con tus padres y dos hermanos en una casa alquilada. Tu mamá vende comida por encargo. Tu papá trabaja donde salga.',money:36,skill:45,network:43,health:70},
{where:'Ciudad Sandino',tier:1,text:'La casa es de la familia, pero todavía le faltan cosas. Siempre hay alguien entrando o saliendo y casi todo se resuelve entre parientes.',money:34,skill:43,network:49,health:69},
{where:'León',tier:2,text:'Tus padres trabajan y alcanzan, pero cualquier gasto grande se conversa varios días. Hay familiares cerca para casi todo.',money:47,skill:50,network:50,health:72},
{where:'Estelí',tier:2,text:'Tu familia vive estable y conoce gente en comercio, talleres y negocios de la zona. No sobra, pero hay dónde moverse.',money:50,skill:49,network:56,health:73},
{where:'Juigalpa',tier:2,text:'Tu familia combina salario con cosas del campo. Hay meses buenos y meses en que nadie quiere hablar de plata.',money:49,skill:46,network:55,health:73},
{where:'Managua',tier:3,text:'Tus padres son profesionales. Hay carro y colegio privado, pero también cuota, préstamo y una libreta mental de gastos que nunca termina.',money:63,skill:59,network:59,health:76},
{where:'Managua',tier:4,text:'Tu familia tiene negocio propio. Desde pequeño escuchás hablar de clientes, proveedores, caja y gente que quedó debiendo.',money:74,skill:57,network:71,health:76},
{where:'Managua',tier:5,text:'Tu familia tiene patrimonio, conexiones y decisiones importantes ya medio tomadas por vos antes de que entendás qué significan.',money:87,skill:65,network:84,health:78}
];
const schoolByTier={
1:['Roberto Clemente','colegio público del distrito','Instituto Ramírez Goyena'],
2:['Colegio Bautista','La Salle','colegio subvencionado cerca de tu casa'],
3:['Centro América','Calasanz','Teresiano','La Salle'],
4:['Centro América','Teresiano','Calasanz','Notre Dame'],
5:['Centro América','Teresiano','Notre Dame','Lincoln International Academy']};
const stages=[
{key:'school',name:'COLEGIO',age:6},
{key:'teen',name:'ADOLESCENCIA',age:15},
{key:'study',name:'QUÉ HACÉS DESPUÉS',age:18},
{key:'job',name:'PRIMER TRABAJO',age:22},
{key:'partner',name:'PAREJA',age:27},
{key:'marriage',name:'CASARTE O NO',age:30},
{key:'risk',name:'PRIMER RIESGO GRANDE',age:33},
{key:'home',name:'VIVIENDA',age:37},
{key:'family',name:'HIJOS Y FAMILIA',age:41},
{key:'career',name:'SEGUNDO AIRE',age:48},
{key:'retire',name:'RETIRO',age:62},
{key:'legacy',name:'LEGADO',age:72}
];
let S=null;
function start(){const o=pick(origins);const birth=1980+Math.floor(Math.random()*22);S={o,birth,i:0,age:0,money:o.money,skill:o.skill,network:o.network,health:o.health,family:55,nerve:50,route:'',married:false,kids:0,home:false,history:[],school:'',alive:true};renderScene()}
function rating(){return clamp(Math.round((S.money+S.skill+S.network+S.health+S.family+S.nerve)/6))}
function svgAvatar(age){const skin='#b87855',shirt=age<12?'#e9a84b':age<25?'#4b94c6':age<55?'#3c7f68':'#6f7b8e',headY=age<5?83:age<13?70:age<55?62:64,headR=age<5?31:age<13?28:26,bodyTop=headY+24,bodyH=age<5?63:age<13?92:120,hair=age>61?'#ddd8cf':'#332a26',wr=age>55?'<path d="M76 61h14M111 61h14M82 87q18 8 36 0" stroke="#8c5b4b" stroke-width="1.5" opacity=".45" fill="none"/>':'';return `<svg viewBox="0 0 200 230" aria-label="avatar de ${age} años"><ellipse cx="100" cy="220" rx="48" ry="9" fill="rgba(20,33,61,.13)"/><path d="M76 ${bodyTop+bodyH-18}l-8 38M124 ${bodyTop+bodyH-18}l8 38" stroke="#27334d" stroke-width="16" stroke-linecap="round"/><path d="M64 223h26M110 223h27" stroke="#14213d" stroke-width="9" stroke-linecap="round"/><rect x="64" y="${bodyTop}" width="72" height="${bodyH}" rx="26" fill="${shirt}"/><path d="M68 ${bodyTop+24}q-24 25-19 58M132 ${bodyTop+24}q24 25 19 58" stroke="${skin}" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="100" cy="${headY}" r="${headR}" fill="${skin}"/><path d="M72 ${headY-10}q10-25 30-24q25 0 29 24q-14-10-30-6q-16-6-29 6" fill="${hair}"/><circle cx="89" cy="${headY+3}" r="3" fill="#14213d"/><circle cx="111" cy="${headY+3}" r="3" fill="#14213d"/><path d="M93 ${headY+18}q7 5 14 0" fill="none" stroke="#76493b" stroke-width="2.5" stroke-linecap="round"/>${wr}</svg>`}
function schoolScene(){const pool=schoolByTier[S.o.tier]||schoolByTier[2];const school=pick(pool);S.school=school;return {draw:'TE TOCÓ',headline:school,body:`Tus papás consiguen cupo en ${school}. La pregunta real no es si el colegio es perfecto, sino qué hacen con la oportunidad que tienen.`,choices:[
{t:'Aprovechar y meterle',p:.72,stat:'skill',good:'Te adaptás bien. Salís con buenas notas y gente nueva alrededor.',bad:'Te cuesta más de lo esperado. Pasás, pero sin destacar.',g:{skill:9,network:5},b:{skill:2,nerve:-3}},
{t:'Ir normal, sin volverte loco',direct:{family:3,skill:3},good:'Hacés una vida bastante normal en el colegio.'},
{t:'Buscar cómo sobresalir fuera de clases',p:.62,stat:'nerve',good:'Encontrás algo que se te da y empezás a construir confianza fuera del aula.',bad:'Probás varias cosas y ninguna termina de agarrar.',g:{nerve:8,network:5},b:{nerve:2}}
]}}
function teenScene(){return {draw:'A LOS 15',headline:pick(['Te ofrecen trabajar los sábados','Un profesor te habla de una beca','Tus amigos ya están agarrando caminos distintos']),body:'Todavía vivís con tus padres, pero ya hay decisiones que empiezan a mover tu vida por cuenta propia.',choices:[
{t:'Meterle de verdad',p:.64,stat:'nerve',good:'El esfuerzo paga. Llegás a los 18 con una ventaja concreta.',bad:'Le metés tiempo y el resultado no es tan grande como esperabas.',g:{skill:8,nerve:7,money:3},b:{skill:3,nerve:-2}},
{t:'Seguir tranquilo',direct:{family:4,health:3},good:'No pasa nada extraordinario. Tampoco se te descarrila nada.'},
{t:'Buscar cómo hacer plata',p:.60,stat:'network',good:'Conseguís una entrada pequeña y empezás a conocer gente que trabaja.',bad:'Probás varias vueltas y ninguna dura mucho.',g:{money:8,network:6},b:{money:2,skill:-2}}
]}}
function studyScene(){let opts=[];if(S.o.where==='León')opts.push(choicePath('UNAN-León','Universidad.',.75,'professional',{skill:12,network:7,money:-4}));else opts.push(choicePath('UNAN-Managua','Universidad.',.72,'professional',{skill:12,network:7,money:-4}));opts.push(choicePath('UNI','Ingeniería.',.61,'professional',{skill:14,nerve:6,money:-5}));opts.push(choicePath('INATEC','Técnico y salir rápido a trabajar.',.80,'technical',{skill:11,money:5}));if(S.o.tier>=3)opts.push(choicePath('Universidad privada','La familia puede hacer el esfuerzo.',.77,'professional',{skill:11,network:11,money:-7}));opts.push(choicePath('Trabajar de una vez','Empezar a ganar antes.',.73,'work',{money:10,network:5,skill:4}));if(S.o.tier>=4)opts.push(choicePath('Entrar al negocio familiar','Aprender caja, clientes y proveedores.',.74,'business',{money:10,network:12,skill:5}));return {draw:'SALISTE DEL COLEGIO',headline:'Te aparecen tres caminos',body:'No son las únicas opciones posibles. Son las tres que tenés enfrente ahorita.',choices:sample(opts,3)}}
function choicePath(t,sub,p,route,g){return{t,sub,p,stat:'skill',route,good:`El camino de ${t} te funciona y avanzás más rápido de lo previsto.`,bad:`Entrás por ${t}, pero el arranque es más lento de lo que imaginabas.`,g,b:{skill:3,money:-2}}}
function jobScene(){const r=S.route;const map={professional:[['Banco','Puesto formal y ruta clara.'],['Distribuidora','Ventas, calle y comisiones.'],['Puesto junior','Empezar desde abajo en tu profesión.']],technical:[['Taller establecido','Aprender con volumen real.'],['Industria','Horario fijo y prestaciones.'],['Trabajar por tu cuenta','Clientes propios.']],business:[['Seguir con la familia','Más responsabilidad.'],['Empresa ajena','Probarte fuera.'],['Abrir algo pequeño','Tu propia caja.']],work:[['Zona franca','Ingreso estable.'],['Ventas','Comisión y calle.'],['Irte a Costa Rica','Un familiar te recibe.']]};return {draw:'PRIMER TRABAJO',headline:'Estas son las opciones que te salen',body:'No escogés desde un catálogo infinito. Escogés entre lo que realmente tenés disponible.',choices:(map[r]||map.work).map((x,i)=>({t:x[0],sub:x[1],p:[.76,.66,.58][i],stat:i===1?'network':'nerve',route:r,good:`Entrás a ${x[0]} y el movimiento te abre mejores opciones en pocos años.`,bad:`Entrás a ${x[0]}, pero la realidad es más lenta de lo que parecía.`,g:{money:9+i*2,network:5+i*2,skill:4},b:{money:4,nerve:-2}}))}}
function partnerScene(){const who=pick(['alguien que conociste por amigos','una compañera de trabajo','alguien que conocés desde el colegio','alguien que vive en otra ciudad']);return {draw:'TE TOCÓ',headline:who,body:'La relación se pone seria. Nadie te obliga a decidir hoy, pero seguir también es una decisión.',choices:[{t:'Meterte de lleno',p:.66,stat:'family',good:'La relación se vuelve una parte estable de tu vida.',bad:'La relación pesa más de lo que suma y termina después de un tiempo.',g:{family:12,health:3},b:{family:-9,nerve:-5}},{t:'Ir despacio',direct:{family:4,nerve:3},good:'Seguís conociendo a la persona sin mover toda tu vida alrededor.'},{t:'Dejarlo aquí',direct:{family:-2,nerve:6},good:'Cortás antes de que se vuelva más complicado.'}]}}
function marriageScene(){return {draw:'A LOS 30',headline:S.family>58?'La relación sigue en pie':'Tu vida sentimental no está totalmente resuelta',body:'A esta edad ya no es solo “andar”. Vivienda, plata, familia y planes empiezan a mezclarse.',choices:[{t:'Casarte / formalizar',p:.70,stat:'family',good:'Armás hogar. La vida se vuelve más cara, pero también más estable.',bad:'Formalizás y al poco tiempo empiezan problemas serios de convivencia.',g:{family:12,money:-5,health:2},b:{family:-12,money:-7,health:-3},marry:true},{t:'Vivir juntos primero',p:.76,stat:'nerve',good:'La convivencia funciona y aprenden a ordenar gastos y expectativas.',bad:'Vivir juntos deja claro rápido que no quieren lo mismo.',g:{family:8,money:2},b:{family:-8,nerve:2},marry:true},{t:'Seguir por tu cuenta',direct:{nerve:6,money:4},good:'Mantenés independencia y dejás esa decisión para después.'}]}}
function riskScene(){const options=sample([
{t:'Comprar un carro usado',sub:'El vendedor dice que “solo necesita sus detallitos”.',p:.57,stat:'nerve',good:'El carro sale bueno y te cambia movilidad y trabajo.',bad:'A los dos meses entra al taller. Después vuelve a entrar.',g:{money:6,network:4},b:{money:-13,nerve:-5}},
{t:'Poner un negocio pequeño',sub:'Usar casi todo tu ahorro.',p:.52,stat:'network',good:'Agarra viaje y deja de sentirse como experimento.',bad:'No agarra suficiente volumen. Cerrás antes de endeudarte más.',g:{money:17,network:8,nerve:7},b:{money:-14,nerve:-6}},
{t:'Irte a Costa Rica',sub:'Un familiar te recibe al inicio.',p:.65,stat:'nerve',good:'Conseguís trabajo y mandás plata más rápido de lo que esperabas.',bad:'Conseguís trabajo, pero entre alquiler y gastos ahorrás poco.',g:{money:14,nerve:8,network:6},b:{money:4,family:-5}},
{t:'Quedarte como estás',sub:'No mover una vida que viene estable.',direct:{health:4,family:3,money:2},good:'No hay salto grande. Tampoco hay golpe grande.'}
],3);return {draw:'PRIMER RIESGO GRANDE',headline:'Por primera vez tenés algo que perder',body:'Ya tenés historial, algo de ahorro y una vida que podría seguir igual. O no.',choices:options}}
function homeScene(){const opts=[
{t:'Dar prima para una casa',sub:'Hipoteca y cuota mensual.',p:S.money>55?.73:.52,stat:'money',good:'Lográs sostener la cuota. Años después la casa es la base del patrimonio familiar.',bad:'La cuota queda demasiado apretada y pasás años recortando todo lo demás.',g:{money:10,family:7},b:{money:-12,health:-3},home:true},
{t:'Comprar un lote y construir por partes',sub:'Más lento, menos bonito al inicio.',p:.68,stat:'nerve',good:'Construís por etapas y terminás con algo propio sin ahogarte tanto.',bad:'La construcción se estira mucho más de lo previsto.',g:{money:8,family:6},b:{money:-5,nerve:-3},home:true},
{t:'Seguir alquilando',sub:'Mantener flexibilidad.',direct:{money:4,nerve:3},good:'Seguís alquilando y conservás caja para otras oportunidades.'}
];return {draw:'VIVIENDA',headline:'La pregunta deja de ser dónde dormís',body:'Ahora la decisión es cuánto de tu vida querés amarrar a una propiedad.',choices:opts}}
function familyScene(){return {draw:'FAMILIA',headline:S.married?'La pregunta sobre hijos ya está encima de la mesa':'La familia empieza a preguntarte qué vas a hacer',body:'No hay una opción “correcta”. Pero cualquiera de estas cambia casi todo lo que viene después.',choices:[{t:'Tener hijos ahora',p:.72,stat:'family',good:'La casa se vuelve más cara y más cansada. También cambia por completo qué entendés por estabilidad.',bad:'Los primeros años son durísimos económicamente y dormís poco.',g:{family:14,money:-8,health:-4},b:{family:7,money:-13,health:-7},kids:2},{t:'Esperar unos años',direct:{money:5,health:3},good:'Esperás y llegás a la siguiente etapa con más aire financiero.',kids:1},{t:'No tener hijos',direct:{money:8,health:5,nerve:5},good:'Tu vida toma una ruta distinta y tus decisiones de patrimonio quedan mucho más abiertas.',kids:0}]}}
function careerScene(){let opts=[{t:'Aceptar una gerencia',sub:'Más sueldo, más gente encima.',p:.69,stat:'skill',good:'Te va bien y tu ingreso cambia de escala.',bad:'El puesto te queda grande al inicio y pagás el costo en estrés.',g:{money:14,skill:8,network:7},b:{health:-7,nerve:-6,money:5}},{t:'Abrir o expandir negocio',sub:'Usar capital y contactos acumulados.',p:.54,stat:'network',good:'Esta vez ya no empezás desde cero. El negocio crece rápido.',bad:'El mercado no responde como esperabas y perdés parte del capital.',g:{money:20,network:10},b:{money:-16,nerve:-5}},{t:'No mover nada',sub:'Conservar lo que ya funciona.',direct:{health:6,family:5,money:3},good:'Seguís estable y llegás a los 60 con menos sobresaltos.'}];return {draw:'SEGUNDO AIRE',headline:'Todavía te queda una decisión grande de carrera',body:'A los 48 ya sabés bastante más. También tenés más que perder.',choices:opts}}
function retireScene(){return {draw:'A LOS 62',headline:'Ya podés bajar el ritmo',body:'No significa que querás hacerlo. Tu salud, plata y familia ya cuentan más que el cargo.',choices:[{t:'Retirarte de verdad',direct:{health:10,family:8,money:-2},good:'Bajás el ritmo y empezás a usar el tiempo de otra manera.'},{t:'Seguir trabajando',p:.63,stat:'health',good:'Aguantás varios años más y todavía acumulás patrimonio.',bad:'El cuerpo empieza a cobrarte la factura.',g:{money:11,network:5},b:{money:5,health:-12}},{t:'Ayudar a los hijos / familia',p:.78,stat:'family',good:'Tu experiencia termina abriendo oportunidades para la siguiente generación.',bad:'Ayudás más de lo que tu caja aguanta y te toca reajustar.',g:{family:12,network:5},b:{money:-8,family:6}}]}}
function legacyScene(){return {draw:'LEGADO',headline:'Ya no estás decidiendo solo por vos',body:'Propiedades, ahorros, negocio, recuerdos y relaciones: lo que queda no es una sola cifra.',choices:[{t:'Ordenar todo y repartir claro',p:.85,stat:'nerve',good:'Dejás papeles, decisiones y expectativas bastante claras.',bad:'Aun ordenándolo, quedan desacuerdos que no podés resolver por todos.',g:{family:10,nerve:6},b:{family:2}},{t:'Dejar que la familia resuelva después',direct:{nerve:4},good:'No ordenás demasiado. La familia tendrá que sentarse después.'},{t:'Vender parte y disfrutar ahora',p:.72,stat:'health',good:'Convertís parte del patrimonio en tiempo, viajes y tranquilidad.',bad:'Gastás más rápido de lo previsto y terminás reajustando al final.',g:{health:8,family:5,money:-4},b:{money:-10,health:3}}]}}
function getScene(){const k=stages[S.i].key;return ({school:schoolScene,teen:teenScene,study:studyScene,job:jobScene,partner:partnerScene,marriage:marriageScene,risk:riskScene,home:homeScene,family:familyScene,career:careerScene,retire:retireScene,legacy:legacyScene})[k]()}
function sample(a,n){const c=[...a],o=[];while(c.length&&o.length<n)o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);return o}
function renderScene(){if(!S){renderStart();return}if(S.i>=stages.length){finish();return}const st=stages[S.i];S.age=st.age;const sc=getScene();A.innerHTML=`<div class="top"><div class="brand">NICAVIDA</div><div class="step">DECISIÓN ${S.i+1}/12</div></div><div class="progress">${stages.map((_,i)=>`<i class="seg ${i<S.i?'done':i===S.i?'now':''}"></i>`).join('')}</div><div class="meta"><div><div class="stage">${st.name}</div><div class="age">${st.age} años</div><div class="year">${S.birth+st.age} · ${S.o.where}</div></div><div class="rating"><small>Cómo vas</small><b>${rating()}</b></div></div><div class="avatarZone"><div class="sun"></div><div class="ground"></div><div class="avatar">${svgAvatar(st.age)}</div></div><section class="card"><div class="drawlab">${sc.draw}</div><div class="draw">${sc.headline}</div><h2>${st.name}</h2><p class="body">${sc.body}</p><div class="choices">${sc.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${c.t}${c.sub?`<span class="sub">${c.sub}</span>`:''}</span>${c.p?`<span class="chance">${Math.round(adjustChance(c)*100)}%</span>`:''}</button>`).join('')}</div></section>`;A.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(sc.choices[+b.dataset.i]))}
function adjustChance(c){if(!c.p)return 1;const stat=S[c.stat||'nerve']||50;return Math.max(.15,Math.min(.9,c.p+(stat-50)*.003))}
function apply(fx){if(!fx)return;for(const [k,v] of Object.entries(fx))if(k in S&&typeof S[k]==='number')S[k]=clamp(S[k]+v)}
function choose(c){const good=!c.p||Math.random()<adjustChance(c);if(c.direct)apply(c.direct);else apply(good?c.g:c.b);if(c.route&&good)S.route=c.route;if(c.marry&&good)S.married=true;if(Number.isInteger(c.kids))S.kids=c.kids;if(c.home&&good)S.home=true;const st=stages[S.i];S.history.push({age:st.age,text:`${c.t}: ${good?(c.good||'Te funciona.'):(c.bad||'No sale como esperabas.')}`});const title=good?'Te salió bien':'No salió como esperabas';const body=good?(c.good||'La decisión te funciona.'):(c.bad||'La decisión te pega.');const delta=[];const fx=c.direct|| (good?c.g:c.b)||{};for(const [k,v] of Object.entries(fx)){const names={money:'Plata',skill:'Preparación',network:'Red',health:'Salud',family:'Familia',nerve:'Confianza'};if(names[k]&&v)delta.push(`<span class="chip">${names[k]} ${v>0?'↑':'↓'}</span>`)};document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><div class="result"><div class="status ${good?'good':'bad'}">${good?'RESULTADO POSITIVO':'RESULTADO NEGATIVO'}</div><h3>${title}</h3><p>${body}</p><div class="chips">${delta.join('')}</div><button class="btn primary" id="next">SEGUIR</button></div></div>`);document.getElementById('next').onclick=()=>{document.querySelector('.overlay').remove();S.i++;if(S.health<=8&&S.age>30){earlyDeath();return}renderScene()}}
function earlyDeath(){const age=S.age+Math.floor(Math.random()*4);finish(age,true)}
function finish(forcedAge=null,early=false){let age=forcedAge;if(!age){const base=58+Math.round(S.health*.34)+Math.floor(Math.random()*12);age=Math.max(61,Math.min(96,base))}const causes=age<55?['un accidente de tránsito','una complicación médica inesperada']:age<70?['un infarto','una complicación de salud','cáncer detectado tarde','una enfermedad repentina']:['causas naturales','una complicación respiratoria','un infarto','una enfermedad después de varios años de salud frágil'];const cause=pick(causes);const score=rating();const label=score>=80?'Dejaste la vara alta':score>=67?'Te fue bastante bien':score>=54?'Resolviste':score>=42?'Tuviste de todo':'Fue una vida dura';A.innerHTML=`<section class="end"><div class="mark">NV</div><div class="stage">TU VIDA</div><h2>Moriste a los ${age}</h2><p class="death">Moriste por ${cause}. ${S.home?'Dejaste una casa propia. ':'Nunca terminaste de amarrarte a una casa propia. '}${S.kids?`Tuviste ${S.kids} ${S.kids===1?'hijo':'hijos'}. `:'No tuviste hijos. '}${S.married?'En algún momento formaste un hogar. ':''}</p><div class="grid"><div class="stat"><small>Resultado</small><b>${score}</b></div><div class="stat"><small>Final</small><b>${label}</b></div><div class="stat"><small>Plata</small><b>${Math.round(S.money)}</b></div><div class="stat"><small>Salud</small><b>${Math.round(S.health)}</b></div></div><div class="timeline">${S.history.map(h=>`<div class="tl"><b>${h.age}</b><span>${h.text}</span></div>`).join('')}</div><button class="btn primary" onclick="start()">VIVIR OTRA VIDA</button></section>`}
function renderStart(){A.innerHTML=`<section class="start"><div class="mark">NV</div><div class="stage">NICARAGUA · LIFE SIMULATOR</div><h1>NICAVIDA</h1><p>Nacés con una mano que no escogiste. Después tenés 12 decisiones para ver qué vida armás con ella.</p><button class="btn primary" id="go">NACER</button><p style="font-size:11px;color:var(--muted);margin-bottom:0">Una partida dura pocos minutos. Las oportunidades cambian según cómo venís.</p></section>`;document.getElementById('go').onclick=start}
window.onerror=(m)=>{A.innerHTML=`<div class="fatal"><h2>Algo se rompió</h2><p>${String(m)}</p><button class="btn primary" onclick="location.reload()">RECARGAR</button></div>`};renderStart();
</script></body></html>
